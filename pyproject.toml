[project]
name = "qa-py-selenium-requests"
version = "1.0.0"
description = "A pytest-based testing framework for web UI and API testing"
authors = [{name = "yashwant-das"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium==4.51.0",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "Faker==40.43.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = [
    "pytest==9.1.1",
    "pytest-html==4.2.0",
    "pytest-xdist==3.8.0",
    "allure-pytest==2.16.2",
    "jsonschema==4.26.0",
]
lint = ["ruff==0.17.2"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "pre-commit==4.7.0",
]

[tool.uv]
required-version = ">=0.13.4"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 110
target-version = "py311"
force-exclude = true
extend-exclude = ["env", "reports", "allure-results", "allure-report", "gh-pages"]

[tool.ruff.lint]
# Preserve the existing Flake8 checks and isort import sorting.
select = ["E", "F", "I", "W"]
ignore = ["E203"]
