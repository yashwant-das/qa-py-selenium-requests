name: Python CI Tests

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file for CI
      run: |
        echo "SAUCE_USERNAME=${{ secrets.SAUCE_USERNAME }}" > config/.env
        echo "SAUCE_PASSWORD=${{ secrets.SAUCE_PASSWORD }}" >> config/.env
        echo "BOOKER_USERNAME=${{ secrets.BOOKER_USERNAME }}" >> config/.env
        echo "BOOKER_PASSWORD=${{ secrets.BOOKER_PASSWORD }}" >> config/.env
        echo "TEST_ENV=ci" >> config/.env

    - name: Run Pytest tests
      run: pytest --alluredir=reports/allure-results

    - name: Upload Allure results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-py${{ matrix.python-version }}
        path: reports/allure-results
        retention-days: 7

    # The report is built and published from one Python version so the matrix jobs don't race on gh-pages.
    - name: Check out report history
      if: always() && matrix.python-version == '3.11'
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure report
      if: always() && matrix.python-version == '3.11'
      run: |
        npm install -g allure-commandline@2
        mkdir -p reports/allure-results
        if [ -d gh-pages/history ]; then
          cp -r gh-pages/history reports/allure-results/history
        fi
        allure generate reports/allure-results --clean -o allure-report

    - name: Deploy Allure report to GitHub Pages
      if: always() && matrix.python-version == '3.11' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
