name: Python CI Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.4'
          python-version: '3.11'
          enable-cache: true
      - name: Install lint dependencies
        run: uv sync --locked --only-group lint
      - name: Check Python
        run: |
          uv run --no-sync ruff check --output-format=github .
          uv run --no-sync ruff format --check .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.24.0

  test:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Configure public demo tests
        run: cp config/.env.example config/.env
      - name: Run tests
        env:
          TEST_ENV: ci
        run: uv run --no-sync pytest -W error --alluredir=reports/allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-py${{ matrix.python-version }}
          path: reports/allure-results
          retention-days: 7

  publish-report:
    needs: test
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.test.result == 'failure')
    permissions:
      contents: write
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allure-results-py3.15
          path: reports/allure-results
      - name: Check out report history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate Allure report
        run: |
          npm install -g allure-commandline@2
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history reports/allure-results/history
          fi
          allure generate reports/allure-results --clean -o allure-report
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
